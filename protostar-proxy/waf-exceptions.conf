# protostar-proxy — local WAF exceptions (Coraza / SecLang).
# Included by the Caddyfile AFTER the OWASP CRS rules. Put route-scoped rule
# exclusions and other local tuning here rather than editing the vendored
# coreruleset-4.28.0/ files (so CRS stays cleanly upgradeable).
#
# Give local rules IDs in the 1000-99999 range (CRS uses 900000+).
#
# --- Cypher endpoint (/neo4j/tx/commit) ---
# Cypher trips CRS's generic signatures: `MATCH .. WHERE ..` reads as SQL
# injection (942xxx), and `->(m)` reads as a Unix shell redirect (932xxx). Drop
# those two CRS categories for exactly this endpoint. CRS stays fully active on
# /api and the app shell, and the custom Neo4j hard-block rules in the Caddyfile
# (id:1000/1001) still guard the Cypher body for writes and unbounded traversals.
# NB: Coraza runs before the /neo4j -> /db/neo4j rewrite, so it sees /neo4j/tx/commit.

SecRule REQUEST_URI "@beginsWith /neo4j/tx/commit" "id:1002,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-sqli,ctl:ruleRemoveByTag=attack-rce"

# --- LLM prompt endpoints (/api/askllm, /api/asklocalllm) ---
# The request body is a free-text natural-language `question` plus security-report
# prose (entity data, alert descriptions) forwarded as-is to the LLM API. That prose
# routinely contains words CRS's generic signatures key on (e.g. "system", "user(")
# and gets misread as PHP/SQL/RCE payloads (933160, 942190, 932xxx), 403ing a normal
# question and forcing a client-side logout (any non-2xx here is treated as an auth
# failure). Flask never builds SQL/Cypher/shell commands from this input — it's just
# passed to the LLM — so these CRS categories provide no real protection on this
# route. Drop them here, same rationale as id:1002 above.
SecRule REQUEST_URI "@rx ^/api/(askllm|asklocalllm)$" "id:1004,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-sqli,ctl:ruleRemoveByTag=attack-rce,ctl:ruleRemoveByTag=attack-injection-php"

# --- Host header is a numeric IP address (920350) ---
# This deployment is reached by IP on the LAN (the self-signed cert has SANs for
# the LAN IP), so a numeric-IP Host header is normal here, not suspicious. 920350
# fires on EVERY such request — by far the largest source of audit-log noise — and
# adds anomaly score for nothing. 920350 is phase:1, so a per-request phase:1
# ctl:ruleRemoveById (defined after it via include order) is too late — remove it
# from the ruleset at load time instead. NB: this applies at STARTUP — a
# `caddy reload` does not re-provision rule removals, so restart the proxy (not
# just -Reload) after changing it. (Reconsider if this ever gets a real
# hostname/domain, where a numeric-IP Host could again be notable.)
SecRuleRemoveById 920350

# --- Login portal redirect target (/auth/?redirect_url=...) ---
# The gate redirects unauthenticated requests to /auth/?redirect_url=<this origin>.
# When the app is reached by IP (LAN), that origin is an IP-address URL, which trips
# CRS 931100 (RFI: URL parameter using IP address, severity critical = score 5),
# hitting the anomaly threshold so 949110 BLOCKS the login flow with 403 for any
# off-box (IP-addressed) client — while localhost (a hostname) is unaffected. The
# redirect_url is the gate's own same-origin redirect, not an RFI target, so drop
# just that one arg from 931100 across /auth/* (phase:1 ctl beats the phase:2 rule).
SecRule REQUEST_URI "@beginsWith /auth/" "id:1005,phase:1,pass,nolog,ctl:ruleRemoveTargetById=931100;ARGS:redirect_url"
